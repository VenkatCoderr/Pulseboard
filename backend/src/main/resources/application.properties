spring.application.name=uptime-monitor-saas
server.port=8080
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/uptime_monitor
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# JWT
# Replace this development secret before deploying to production.
app.jwt.secret=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origin=http://localhost:5173

# Monitor scheduler
app.monitor.timeout-ms=10000
app.monitor.scheduler.fixed-delay-ms=60000

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=venkateshprabhu480@gmail.com
spring.mail.password=vgaihhyuzrimdnzh

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
